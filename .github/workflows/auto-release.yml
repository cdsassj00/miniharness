name: Auto release

# 버전 푸시만으로 전체 배포 — 사람 클릭 0회.
# main 에 node-cli/package.json 버전이 바뀐 커밋이 푸시되면:
#   ① npm 에 새 버전인지 확인 → ② npm publish → ③ GitHub Release(v버전) 자동 생성
#   → ④ Windows/macOS/Linux 단일 실행파일 빌드해 Release 에 첨부
on:
  push:
    branches: [main]
    paths: ["node-cli/package.json"]
  workflow_dispatch:

permissions:
  contents: write # Release 생성·자산 첨부용

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_new: ${{ steps.v.outputs.is_new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V=$(node -p "require('./node-cli/package.json').version")
          PUB=$(npm view cdsa-harness version 2>/dev/null || echo "0.0.0")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$V" != "$PUB" ]; then echo "is_new=true" >> "$GITHUB_OUTPUT"; else echo "is_new=false" >> "$GITHUB_OUTPUT"; fi
          echo "로컬=$V · npm=$PUB"

  publish-npm:
    needs: check
    if: needs.check.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Run tests
        run: node --test
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-release:
    needs: check
    if: needs.check.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release (tag v${{ needs.check.outputs.version }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          generate_release_notes: true

  binaries:
    needs: [check, create-release]
    if: needs.check.outputs.is_new == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cdsa-harness-linux
            bin: cdsa-harness
          - os: macos-latest
            artifact: cdsa-harness-macos
            bin: cdsa-harness
          - os: windows-latest
            artifact: cdsa-harness-win.exe
            bin: cdsa-harness.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: node-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install build deps
        run: npm install
      - name: Build single-file binary
        run: node scripts/build-exe.mjs
      - name: Rename artifact
        shell: bash
        run: cp "node-cli/dist/${{ matrix.bin }}" "${{ matrix.artifact }}"
        working-directory: .
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          files: ${{ matrix.artifact }}
